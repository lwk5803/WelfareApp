{% extends "base.html" %}
{% block title %}로그인 - 복지관 회원 관리{% endblock %}
{% block bare_content %}
<div class="min-h-screen flex items-center justify-center bg-ivory px-4">
  <div class="card w-full max-w-sm">
    <div class="flex flex-col items-center gap-2 mb-6">
      <div class="w-12 h-12 rounded-xl2 bg-primary flex items-center justify-center text-white"><i data-lucide="heart-handshake" class="w-6 h-6"></i></div>
      <h1 class="font-bold text-lg text-primary-dark">복지관 회원 관리</h1>
    </div>
    {% if error %}
    <div class="alert alert-danger mb-4"><i data-lucide="alert-circle" class="w-4 h-4 mt-0.5"></i><span>{{ error }}</span></div>
    {% endif %}
    <form method="post" action="/login" class="space-y-4">
      <div>
        <label for="email">이메일</label>
        <input type="email" id="email" name="email" required autofocus>
      </div>
      <div>
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-block">로그인</button>
    </form>
  </div>
</div>
{% endblock %}
